<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C547"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B3DBE"/>
      <stop offset="100%" style="stop-color:#6B1D8E"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2AAA8A"/>
      <stop offset="100%" style="stop-color:#0D6E5D"/>
    </linearGradient>
  </defs>
  <!-- T -->
  <rect x="30" y="20" width="120" height="18" rx="3" fill="url(#gold)"/>
  <rect x="72" y="20" width="22" height="100" rx="3" fill="url(#gold)"/>
  <!-- Circuit lines on T -->
  <line x1="42" y1="45" x2="42" y2="85" stroke="#2AAA8A" stroke-width="2"/>
  <circle cx="42" cy="85" r="3" fill="#2AAA8A"/>
  <line x1="52" y1="50" x2="52" y2="75" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="52" cy="75" r="3" fill="#D4AF37"/>
  <line x1="62" y1="48" x2="62" y2="90" stroke="#7B2D8E" stroke-width="2"/>
  <circle cx="62" cy="90" r="3" fill="#7B2D8E"/>
  <!-- F -->
  <rect x="160" y="20" width="22" height="100" rx="3" fill="url(#gold)"/>
  <rect x="160" y="20" width="70" height="16" rx="3" fill="url(#gold)"/>
  <rect x="160" y="58" width="55" height="14" rx="3" fill="url(#gold)"/>
  <!-- Purple accent in F -->
  <rect x="170" y="36" width="10" height="22" rx="2" fill="url(#purple)" opacity="0.7"/>
  <!-- A -->
  <polygon points="270,120 300,20 330,120" fill="url(#gold)" stroke="none"/>
  <polygon points="285,120 300,50 315,120" fill="url(#teal)" opacity="0.6"/>
  <rect x="275" y="82" width="50" height="14" rx="3" fill="url(#gold)"/>
  <!-- Extended A right side -->
  <polygon points="330,120 355,20 370,60" fill="url(#gold)" stroke="none"/>
  <!-- Subtitle line -->
  <line x1="30" y1="145" x2="100" y2="145" stroke="url(#teal)" stroke-width="1.5"/>
  <line x1="300" y1="145" x2="370" y2="145" stroke="url(#teal)" stroke-width="1.5"/>
  <!-- Subtitle text -->
  <text x="200" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#666">
    SOLUÇÕES DIGITAIS · IA · APPS E SAAS
  </text>
  <!-- Small circuit dots -->
  <circle cx="105" cy="145" r="2.5" fill="#7B2D8E"/>
  <line x1="105" y1="145" x2="120" y2="145" stroke="#7B2D8E" stroke-width="1"/>
  <circle cx="295" cy="145" r="2.5" fill="#2AAA8A"/>
  <line x1="280" y1="145" x2="295" y2="145" stroke="#2AAA8A" stroke-width="1"/>
</svg>