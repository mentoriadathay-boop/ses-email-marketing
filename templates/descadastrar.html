{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:60vh">
  <div class="card text-center" style="max-width:480px;width:100%">
    <div class="card-body py-5 px-4">
      <div class="mb-3" style="font-size:3rem">&#128274;</div>
      <h4 class="fw-bold mb-2">Descadastro realizado</h4>
      {% if email %}
      <p class="text-muted mb-1">O endereco <strong>{{ email }}</strong> foi removido desta sequencia de emails.</p>
      {% else %}
      <p class="text-muted mb-1">Voce foi removido desta sequencia de emails.</p>
      {% endif %}
      <p class="text-muted small">Voce nao recebera mais mensagens desta cadencia.</p>
    </div>
  </div>
</div>
{% endblock %}
