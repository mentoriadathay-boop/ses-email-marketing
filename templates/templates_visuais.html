{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <div class="stat-card d-flex align-items-center justify-content-center"
       style="width:48px;height:48px;background:linear-gradient(135deg,#4361ee,#06d6a0);border-radius:12px;flex-shrink:0;">
    <i class="bi bi-grid-1x2 fs-5 text-white"></i>
  </div>
  <div>
    <h4 class="mb-0 fw-bold">Templates Visuais</h4>
    <small class="text-muted">12 modelos prontos — use direto ou personalize com IA</small>
  </div>
</div>

<!-- Filtro por categoria -->
<div class="d-flex gap-2 flex-wrap mb-4">
  <button class="btn btn-sm btn-primary cat-btn" onclick="filtrarCat('todos',this)">Todos</button>
  {% for cat in ['Texto Corrido','Vendas','Educacional','Eventos','Reengajamento'] %}
  <button class="btn btn-sm btn-outline-secondary cat-btn" onclick="filtrarCat('{{ cat }}',this)">{{ cat }}</button>
  {% endfor %}
</div>

<!-- Grade de cards -->
<div class="row g-3" id="gradeTemplates"></div>

<!-- Modal de prévia -->
<div class="modal fade" id="modalPrevia" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitulo">Prévia do Template</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <iframe id="previaFrame" style="width:100%;min-height:600px;border:none;" frameborder="0"></iframe>
      </div>
      <div class="modal-footer gap-2">
        <div class="me-auto d-flex gap-2 align-items-center">
          <label class="form-label mb-0 small fw-semibold">Kit de Marca:</label>
          <select id="kitAplicar" class="form-select form-select-sm" style="width:200px;">
            <option value="">Sem kit</option>
            {% for k in kits %}
            <option value="{{ k.id }}" data-name="{{ k.name }}">{{ k.name }}</option>
            {% endfor %}
          </select>
          <button class="btn btn-sm btn-outline-primary" onclick="aplicarKit()">Aplicar Kit</button>
        </div>
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-outline-primary" onclick="personalizarComIA()">
          <i class="bi bi-stars me-1"></i>Personalizar com IA
        </button>
        <button class="btn btn-primary" onclick="usarTemplate()">
          <i class="bi bi-send me-1"></i>Usar em Nova Campanha
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

let _templateAtivo = null;

function filtrarCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.className = b === btn ? 'btn btn-sm btn-primary cat-btn' : 'btn btn-sm btn-outline-secondary cat-btn';
  });
  const grade = document.getElementById('gradeTemplates');
  grade.innerHTML = '';
  const lista = cat === 'todos' ? _TEMPLATES : _TEMPLATES.filter(t => t.cat === cat);
  lista.forEach(t => {
    const col = document.createElement('div');
    col.className = 'col-md-4 col-sm-6';
    col.innerHTML = `
      <div class="card h-100" style="cursor:pointer;transition:transform .15s,box-shadow .15s;"
           onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 24px rgba(0,0,0,.12)'"
           onmouseout="this.style.transform='';this.style.boxShadow=''">
        <div style="height:140px;background:${t.cor};border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-size:48px;">
          ${t.icone}
        </div>
        <div class="card-body p-3">
          <span class="badge mb-2" style="background:${t.cor}22;color:${t.cor};font-size:.7rem;">${t.cat}</span>
          <h6 class="fw-bold mb-1">${t.name}</h6>
          <p class="text-muted small mb-3">${t.desc}</p>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-primary flex-fill" onclick="abrirPrevia('${t.id}')">
              <i class="bi bi-eye me-1"></i>Prévia
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="usarDireto('${t.id}')" title="Usar em nova campanha">
              <i class="bi bi-send"></i>
            </button>
          </div>
        </div>
      </div>`;
    grade.appendChild(col);
  });
}

function abrirPrevia(id) {
  _templateAtivo = _TEMPLATES.find(t => t.id === id);
  if (!_templateAtivo) return;
  document.getElementById('modalTitulo').textContent = _templateAtivo.name;
  const iframe = document.getElementById('previaFrame');
  iframe.contentDocument.open();
  iframe.contentDocument.write(_templateAtivo.html);
  iframe.contentDocument.close();
  new bootstrap.Modal(document.getElementById('modalPrevia')).show();
}

async function aplicarKit() {
  if (!_templateAtivo) return;
  const kitId = document.getElementById('kitAplicar').value;
  if (!kitId) { alert('Selecione um kit de marca.'); return; }
  const res = await fetch('/api/brand-kits');
  const kits = await res.json();
  const kit = kits.find(k => String(k.id) === String(kitId));
  if (!kit) return;
  let html = _templateAtivo.html;
  html = html.replace(/#1a3a6b/g, kit.primary_color || '#1a3a6b');
  html = html.replace(/#D4AF37/g, kit.secondary_color || '#D4AF37');
  html = html.replace(/#4361ee/g, kit.accent_color || '#4361ee');
  html = html.replace(/#333333|color:#333(?![a-f0-9])/g, kit.text_color || '#333333');
  html = html.replace(/Arial,sans-serif/g, (kit.font_primary || 'Arial') + ',sans-serif');
  _templateAtivo = { ..._templateAtivo, html };
  const iframe = document.getElementById('previaFrame');
  iframe.contentDocument.open();
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();
}

function personalizarComIA() {
  if (!_templateAtivo) return;
  bootstrap.Modal.getInstance(document.getElementById('modalPrevia')).hide();
  sessionStorage.setItem('template_context', _templateAtivo.name + ' — ' + _templateAtivo.cat);
  window.location.href = '/email-ia';
}

function usarTemplate() {
  if (!_templateAtivo) return;
  sessionStorage.setItem('ia_html', _templateAtivo.html);
  sessionStorage.setItem('ia_subject', _templateAtivo.name);
  bootstrap.Modal.getInstance(document.getElementById('modalPrevia')).hide();
  window.location.href = '/nova-campanha';
}

function usarDireto(id) {
  const tpl = _TEMPLATES.find(t => t.id === id);
  if (!tpl) return;
  sessionStorage.setItem('ia_html', tpl.html);
  sessionStorage.setItem('ia_subject', tpl.name);
  window.location.href = '/nova-campanha';
}

// Inicializa com todos
document.addEventListener('DOMContentLoaded', () => filtrarCat('todos', document.querySelector('.cat-btn')));
</script>
