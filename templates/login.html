<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — ConvertMail</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      max-width: 420px;
      width: 100%;
    }
    .login-header {
      background: linear-gradient(135deg, #1AC78A, #0D6E5D);
      padding: 40px 32px 32px;
      text-align: center;
      color: #fff;
    }
    .login-header h2 { font-weight: 800; margin-bottom: 4px; font-size: 1.5rem; }
    .login-header p { opacity: 0.85; font-size: 0.9rem; margin: 0; }
    .login-body { padding: 32px; }
    .form-control:focus { border-color: #1AC78A; box-shadow: 0 0 0 3px rgba(26,199,138,0.15); }
    .btn-login {
      background: linear-gradient(135deg, #1AC78A, #0D6E5D);
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,199,138,0.4);
      color: #fff;
    }
    .login-footer {
      text-align: center;
      padding: 0 32px 24px;
    }
    .login-footer a { color: #1AC78A; text-decoration: none; font-weight: 600; font-size: 0.85rem; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <img src="/static/logo-tfa-small.png" alt="ConvertMail" style="height:50px;margin-bottom:16px">
      <h2>ConvertMail</h2>
      <p>Email Marketing com IA</p>
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
            {{ message }}
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Entrar</button>
      </form>
    </div>
    <div class="login-footer">
      <a href="/">Voltar para o site</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
