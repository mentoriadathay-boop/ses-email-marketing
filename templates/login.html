<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — ConvertMail</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(160deg, #5B2A6E 0%, #C2298A 45%, #0E997C 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      max-width: 420px;
      width: 100%;
    }
    .login-header {
      background: #FAF7F2;
      padding: 40px 32px 32px;
      text-align: center;
      border-bottom: 1px solid #E3CFA0;
    }
    .login-body { padding: 32px; }
    .form-control:focus { border-color: #5B2A6E; box-shadow: 0 0 0 3px rgba(91,42,110,0.15); }
    .btn-login {
      background: linear-gradient(135deg, #5B2A6E, #C2298A);
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91,42,110,0.4);
      color: #fff;
    }
    .login-footer {
      text-align: center;
      padding: 0 32px 24px;
    }
    .login-footer a { color: #5B2A6E; text-decoration: none; font-weight: 600; font-size: 0.85rem; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <img src="/static/logo-convertmail.png" alt="ConvertMail" style="max-height:160px;width:auto;max-width:90%">
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
            {{ message }}
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-semibold">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Sua senha" required>
            <button type="button" class="input-group-text" onclick="togglePassword()" style="cursor:pointer" tabindex="-1">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <div class="text-end mb-4">
          <a href="{{ url_for('esqueci_senha') }}" class="small" style="color:#5B2A6E;text-decoration:none;font-weight:500">Esqueci minha senha</a>
        </div>
        <button type="submit" class="btn btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Entrar</button>
      </form>
    </div>
    <div class="login-footer">
      <a href="/">Voltar para o site</a>
    </div>
  </div>
  <script>
    function togglePassword(){
      var p=document.getElementById('passwordInput'),i=document.getElementById('eyeIcon');
      if(p.type==='password'){p.type='text';i.className='bi bi-eye-slash'}
      else{p.type='password';i.className='bi bi-eye'}
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
