<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview — ConvertMail</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #e8e8e8; }
    .toolbar { background: #1a1a2e; color: #fff; padding: 12px 20px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
    .toolbar h6 { margin: 0; font-size: .9rem; }
    .device-btn { background: none; border: 1px solid #ffffff33; color: #fff; padding: 4px 12px; border-radius: 6px; font-size: .8rem; cursor: pointer; }
    .device-btn.active { background: #4361ee; border-color: #4361ee; }
    .preview-frame { margin: 24px auto; background: #fff; transition: width .3s; box-shadow: 0 4px 20px rgba(0,0,0,.15); border-radius: 8px; overflow: hidden; }
    .preview-frame.desktop { width: 700px; }
    .preview-frame.mobile { width: 375px; border-radius: 24px; border: 8px solid #333; }
    .preview-frame.tablet { width: 768px; }
    .email-content { padding: 0; }
    .email-content iframe { width: 100%; border: none; min-height: 600px; }
    .spam-score { background: #fff; border-radius: 12px; padding: 16px; margin: 24px auto; max-width: 700px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <div class="toolbar">
    <h6><i class="bi bi-eye me-2"></i>Preview do Email</h6>
    <div style="flex:1"></div>
    <button class="device-btn active" onclick="setDevice('desktop',this)"><i class="bi bi-display me-1"></i>Desktop</button>
    <button class="device-btn" onclick="setDevice('tablet',this)"><i class="bi bi-tablet me-1"></i>Tablet</button>
    <button class="device-btn" onclick="setDevice('mobile',this)"><i class="bi bi-phone me-1"></i>Mobile</button>
    <a href="javascript:window.close()" class="device-btn"><i class="bi bi-x-lg"></i></a>
  </div>

  <div class="spam-score" id="spamScore">
    <div class="d-flex align-items-center gap-3">
      <div class="spinner-border spinner-border-sm text-primary"></div>
      <span class="small">Analisando spam score...</span>
    </div>
  </div>

  <div class="preview-frame desktop" id="previewFrame">
    <div class="email-content">
      <iframe id="emailIframe" srcdoc="{{ email_html | e }}"></iframe>
    </div>
  </div>

  <script>
  function setDevice(device, btn) {
    document.getElementById('previewFrame').className = 'preview-frame ' + device;
    document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  // Auto-resize iframe
  document.getElementById('emailIframe').addEventListener('load', function() {
    try { this.style.height = this.contentDocument.body.scrollHeight + 40 + 'px'; } catch(e) {}
  });

  // Spam score check
  const html = document.getElementById('emailIframe').getAttribute('srcdoc');
  fetch('/ia/verificar-spam', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({html: html, subject: ''})
  }).then(r=>r.json()).then(d => {
    const el = document.getElementById('spamScore');
    const color = d.score >= 80 ? 'success' : d.score >= 60 ? 'warning' : 'danger';
    let html = `<div class="d-flex align-items-center gap-3 mb-2">
      <div class="fs-3 fw-bold text-${color}">${d.score}/100</div>
      <div><div class="fw-semibold">Spam Score: ${d.nivel.charAt(0).toUpperCase() + d.nivel.slice(1)}</div>
      <div class="small text-muted">${d.problemas.length} problema(s) encontrado(s)</div></div>
    </div>`;
    if (d.problemas.length > 0) {
      d.problemas.forEach(p => {
        const sev = p.severidade === 'alta' ? 'danger' : 'warning';
        html += `<div class="d-flex align-items-start gap-2 mt-2 p-2 rounded bg-${sev} bg-opacity-10">
          <i class="bi bi-exclamation-triangle text-${sev} mt-1"></i>
          <div class="small">${p.msg}</div>
        </div>`;
      });
    }
    el.innerHTML = html;
  });
  </script>
</body>
</html>
